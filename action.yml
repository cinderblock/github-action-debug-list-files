# https://docs.github.com/en/actions/sharing-automations/creating-actions/metadata-syntax-for-github-actions
name: Debug - List Files
description: List (with diff) files in a working directory on action runner. Designed for debugging purposes.
author: Cameron Tacklind <cameron@tacklind.com>

inputs:
  name:
    required: false
    description: Named file list (lets you keep separate diff histories per call within one workflow).
    default: ''
  working-directory:
    required: false
    description: Directory to list files of.
    default: '.'
  search:
    required: false
    description: Glob to search with.
    default: '**/*'
  filter:
    required: false
    description: >-
      Regular expression; listed paths that match it are left out. The
      default skips node_modules, .git and __pycache__ directories (but not
      .github or .gitignore). Empty lists everything.
    default: '(^|/)(node_modules|\.git|__pycache__)(/|$)'

runs:
  using: 'node24'
  main: 'dist/index.js'
